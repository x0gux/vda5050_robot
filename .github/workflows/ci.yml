name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: robot-sim/requirements.txt

      - name: Install dependencies
        run: pip install -r robot-sim/requirements.txt

      - name: Run tests
        run: pytest -q robot-sim/tests
